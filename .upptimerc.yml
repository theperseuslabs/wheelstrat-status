# Status page for wheelstrategyoptions.com, served from GitHub Pages so it stays
# up when the Hostinger VPS (or Cloudflare's proxy) is down. Every check runs
# from GitHub's runners against the public URLs, i.e. the path a user takes.

owner: theperseuslabs
repo: wheelstrat-status

# Sent as the User-Agent on every check. Cloudflare needs a WAF skip rule for
# it, otherwise Bot Fight Mode can challenge GitHub's datacenter IPs and the
# page reports a false outage.
user-agent: wheelstrat-status-check

sites:
  - name: Website
    url: https://wheelstrategyoptions.com
    # A 200 alone is not enough: Cloudflare can answer 200 from cache while
    # the origin is dead.
    __dangerous__body_down_if_text_missing: "Wheel Strategy Screener"
    maxResponseTime: 8000

  - name: Web app
    url: https://wheelstrategyoptions.com/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    maxResponseTime: 8000

  - name: Screener API
    # Switch to https://go.wheelstrategyoptions.com/readyz once the
    # feat/api-health-endpoints change is deployed.
    url: https://go.wheelstrategyoptions.com/wheelstrat/availableFilters
    maxResponseTime: 8000

  - name: Options data
    # Database-backed, so this is the one that goes red when Postgres is the
    # problem rather than the box.
    url: https://go.wheelstrategyoptions.com/wheelstrat/topStocksByIvr
    __dangerous__body_down_if_text_missing: '"stocks"'
    maxResponseTime: 15000

  - name: MCP server
    url: https://mcp.wheelstrategyoptions.com/readyz
    __dangerous__body_down_if_text_missing: "ready"
    maxResponseTime: 8000

status-website:
  cname: status.wheelstrategyoptions.com
  name: Wheel Strategy Options Status
  # Branding mirrors wheelstrategyoptions.com (black, gold accent, Inter). The
  # logo is served from this repo so it still loads when the main site is down.
  logoUrl: https://raw.githubusercontent.com/theperseuslabs/wheelstrat-status/master/assets/logo.png
  favicon: https://raw.githubusercontent.com/theperseuslabs/wheelstrat-status/master/assets/logo.png
  theme: night
  links:
    - rel: stylesheet
      href: https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap
  css: >-
    html:root {
    --body-background-color: #000000;
    --body-text-color: #f5f5f5;
    --card-background-color: #0a0a0a;
    --card-border-color: #262626;
    --nav-background-color: #000000;
    --nav-border-bottom-color: #262626;
    --nav-current-border-bottom-color: #c6b57b;
    --up-border-left-color: #10b981;
    --tag-up-background-color: #10b981;
    --degraded-border-left-color: #c6b57b;
    --tag-degraded-background-color: #c6b57b;
    --change-background-color: #c6b57b;
    --down-border-left-color: #ef4444;
    --down-background-color: #2a0b0b;
    --tag-down-background-color: #ef4444;
    --tag-color: #0a0a0a;
    --submit-button-background-color: #c6b57b;
    --submit-button-border-color: #c6b57b;
    --submit-button-color: #0a0a0a;
    --graph-filter: grayscale(1) sepia(1) saturate(1.4) brightness(0.95);
    }
    body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1, h2, h3, h4 { letter-spacing: -0.02em; }
    article { border-radius: 0.5rem; }
    a:hover { color: #c6b57b; }
  introTitle: "**Wheel Strategy Options** status"
  introMessage: Live availability of the website, screener, and options data, checked every 5 minutes from outside our own infrastructure.
  navbar:
    - title: Status
      href: /
    - title: Back to site
      href: https://wheelstrategyoptions.com
